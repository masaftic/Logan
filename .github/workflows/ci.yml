name: .NET CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Restore Dependencies
      run: dotnet restore Api.slnx

    - name: Build Solution
      run: dotnet build Api.slnx --no-restore -c Release

    - name: Run Saga & Domain Tests
      run: dotnet test Api.slnx --no-build -c Release --filter "FullyQualifiedName~OrderSagaLifecycleTests" --logger "trx;LogFileName=test-results.trx"
